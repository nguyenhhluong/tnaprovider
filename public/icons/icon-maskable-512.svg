<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background fills entire viewport for maskable -->
  <rect width="512" height="512" fill="url(#bg)" rx="64"/>
  <!-- TNA logo text, centered within safe zone (central 80%) -->
  <text x="256" y="290" font-family="system-ui, sans-serif" font-size="180" font-weight="700" fill="#E56B2E" text-anchor="middle" dominant-baseline="middle">TNA</text>
  <!-- Subtitle -->
  <text x="256" y="370" font-family="system-ui, sans-serif" font-size="36" font-weight="500" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">Provider</text>
</svg>
